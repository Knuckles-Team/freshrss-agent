[bumpversion]
current_version = 2.1.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(all-extra):pyproject.toml]
search = freshrss-agent[mcp,agent,logfire]>={current_version}
replace = freshrss-agent[mcp,agent,logfire]>={new_version}


[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(mcp-img):docker/Dockerfile]
search = freshrss-agent[mcp]>={current_version}
replace = freshrss-agent[mcp]>={new_version}

[bumpversion:file(agent-img):docker/Dockerfile]
search = freshrss-agent[agent]>={current_version}
replace = freshrss-agent[agent]>={new_version}

[bumpversion:file(tag-example):docker/Dockerfile]
search = -t freshrss-agent:{current_version} .
replace = -t freshrss-agent:{new_version} .

[bumpversion:file(compose-img-tag):docker/agent.compose.yml]
search = knucklessg1/freshrss-agent:{current_version}
replace = knucklessg1/freshrss-agent:{new_version}

[bumpversion:file(deploy-img-tag):docs/deployment.md]
search = knucklessg1/freshrss-agent:{current_version}
replace = knucklessg1/freshrss-agent:{new_version}

[bumpversion:file(install-img-tag):docs/installation.md]
search = knucklessg1/freshrss-agent:{current_version}
replace = knucklessg1/freshrss-agent:{new_version}

[bumpversion:file(readme-img-tag):README.md]
search = knucklessg1/freshrss-agent:{current_version}
replace = knucklessg1/freshrss-agent:{new_version}

[bumpversion:file(readme-img-tag-short1):README.md]
search = agent (`:{current_version}`)
replace = agent (`:{new_version}`)

[bumpversion:file(readme-img-tag-short2):README.md]
search = `[agent]` / `:{current_version}`
replace = `[agent]` / `:{new_version}`

[bumpversion:file:freshrss_agent/agent_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:freshrss_agent/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
