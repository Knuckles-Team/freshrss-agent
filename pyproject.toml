[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "freshrss-agent"
version = "2.3.4"
description = "FreshRSS API + MCP Server"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0", "python-dotenv>=1.2.4", ]
[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0",]
all = [ "freshrss-agent[mcp]>=2.1.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
freshrss-mcp = "freshrss_agent.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
freshrss-agent = "freshrss_agent.skills"

[project.entry-points."agent_connector_sdk.prompt_providers"]
freshrss-agent = "freshrss_agent.prompts"

[project.entry-points."agent_connector_sdk.ontology_providers"]
freshrss-agent = "freshrss_agent.ontology"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
freshrss-mcp = "freshrss_agent"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
freshrss_agent = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config", "connector", "stream"]

[[tool.a2a.capabilities]]
id = "read_feeds"
name = "Read RSS Feed Contents"
description = "Fetch stream contents, item bodies, and unread counts from a FreshRSS instance via the Google Reader API"

[[tool.a2a.capabilities]]
id = "curate_feeds"
name = "Curate RSS Subscriptions"
description = "Subscribe, unsubscribe, label, categorize, mark-read, and star feeds in a FreshRSS instance"

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
