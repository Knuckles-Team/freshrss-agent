[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "freshrss-agent"
version = "2.1.0"
description = "FreshRSS API + MCP Server + A2A Server"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0", "python-dotenv>=1.2.2",]
[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0",]
all = [ "freshrss-agent[mcp,agent,logfire]>=2.1.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
freshrss-mcp = "freshrss_agent.mcp_server:mcp_server"
freshrss-agent = "freshrss_agent.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
freshrss-agent = "freshrss_agent.skills"

[project.entry-points."agent_utilities.prompt_providers"]
freshrss-agent = "freshrss_agent.prompts"

[project.entry-points."agent_utilities.ontology_providers"]
freshrss-agent = "freshrss_agent.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
freshrss-agent = "freshrss_agent.connectors"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
freshrss_agent = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

# Minimal residue for a2a.json generation (CONCEPT:AU-KG.ontology.a2a-card-generation,
# D-OB-1): everything else in a2a.json is derived from this file's [project] table
# by agent-utilities' generate_connector_manifests.py — a2a.json itself is a
# generated artifact, never hand-edited. These two capabilities are genuinely
# per-connector (FreshRSS-specific read/curate actions) and have no other
# canonical source, so they are declared here instead.
[[tool.a2a.capabilities]]
id = "read_feeds"
name = "Read RSS Feed Contents"
description = "Fetch stream contents, item bodies, and unread counts from a FreshRSS instance via the Google Reader API"

[[tool.a2a.capabilities]]
id = "curate_feeds"
name = "Curate RSS Subscriptions"
description = "Subscribe, unsubscribe, label, categorize, mark-read, and star feeds in a FreshRSS instance"

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
